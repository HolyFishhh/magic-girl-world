<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>白木市魔法少女角色创建</title>
  </head>
  <body>
    <div class="magical-girl-creator" id="character-creator-container">
      <!-- 标题区域 -->
      <div class="header-section">
        <h1 class="main-title">
          <span class="sparkle">✨</span>
          白木市角色创建
          <span class="sparkle">✨</span>
        </h1>
        <p class="subtitle">在怪人与怪谈的现代都市中创建你的角色</p>
      </div>

      <!-- 角色创建表单 -->
      <div class="creator-form">
        <div class="section mode-section">
          <h2 class="section-title"><span class="icon">✦</span>选择游戏模式</h2>
          <div class="mode-grid" role="radiogroup" aria-label="选择游戏模式">
            <button class="mode-card selected" type="button" data-mode="story" role="radio" aria-checked="true">
              <span class="mode-icon">📖</span>
              <span class="mode-name">剧情模式</span>
              <span class="mode-desc">以角色扮演和城市故事为主，随时做出选择。</span>
            </button>
            <button class="mode-card" type="button" data-mode="expedition" role="radio" aria-checked="false">
              <span class="mode-icon">🗺</span>
              <span class="mode-name">远征模式</span>
              <span class="mode-desc">在路线、战斗和营火之间推进一场完整远征。</span>
            </button>
          </div>
        </div>

        <!-- 阵营选择 -->
        <div class="section faction-section">
          <h2 class="section-title">
            <span class="icon">⚔️</span>
            选择阵营
          </h2>
          <div class="faction-grid">
            <div class="faction-card" data-faction="magical_girl">
              <div class="faction-icon">🌟</div>
              <div class="faction-name">魔法少女阵营</div>
              <div class="faction-desc">守护正义与和平的魔法使用者</div>
            </div>
            <div class="faction-card" data-faction="evil_forces">
              <div class="faction-icon">👿</div>
              <div class="faction-name">邪恶敌对势力</div>
              <div class="faction-desc">企图破坏世界秩序的黑暗力量</div>
            </div>
            <div class="faction-card" data-faction="ordinary_people">
              <div class="faction-icon">👥</div>
              <div class="faction-name">普通人</div>
              <div class="faction-desc">生活在现代社会中的普通民众</div>
            </div>
          </div>
        </div>

        <!-- 职业选择 -->
        <div class="section job-section">
          <h2 class="section-title">
            <span class="icon">👔</span>
            选择职业
          </h2>
          <div class="job-grid">
            <!-- 职业选项将通过JS动态生成 -->
          </div>
        </div>

        <!-- 地点选择 -->
        <div class="section location-section">
          <h2 class="section-title">
            <span class="icon">🏙️</span>
            选择城市
          </h2>
          <div class="city-grid">
            <!-- 城市选项将通过JS动态生成 -->
          </div>
        </div>

        <!-- 地点选择 -->
        <div class="section location-section" id="location-section-container" style="display: none">
          <h2 class="section-title">
            <span class="icon">🏢</span>
            选择所在地点
          </h2>
          <div class="location-grid">
            <!-- 地点选项将通过JS动态生成 -->
          </div>
        </div>

        <!-- 额外描述 -->
        <div class="section description-section">
          <h2 class="section-title">
            <span class="icon">💭</span>
            额外描述（可选）
          </h2>
          <div class="description-container">
            <textarea
              id="custom-description"
              placeholder="在这里添加角色的特殊设定、性格特点、背景故事等...&#10;例如：喜欢甜食的温柔女孩，有着不为人知的魔法天赋..."
              rows="4"
              maxlength="300"
            >
            </textarea>
            <div class="char-counter"><span id="char-count">0</span>/300</div>
          </div>
        </div>

        <!-- 角色预览 -->
        <div class="section preview-section">
          <h2 class="section-title">
            <span class="icon">👁️</span>
            角色预览
          </h2>
          <div class="character-preview">
            <div class="preview-card">
              <div class="preview-header">
                <div class="preview-name">未设置角色</div>
                <div class="preview-faction">请先选择阵营</div>
              </div>
              <div class="preview-details">
                <div class="preview-item">
                  <span class="label">职业：</span>
                  <span class="value" id="preview-job">未选择</span>
                </div>
                <div class="preview-item">
                  <span class="label">地点：</span>
                  <span class="value" id="preview-location">未选择</span>
                </div>
              </div>
              <div class="preview-description">
                <div class="desc-label">描述：</div>
                <div class="desc-content" id="preview-description">AI将根据你的选择生成角色</div>
              </div>
            </div>
          </div>
        </div>

        <!-- 操作按钮 -->
        <div class="section actions-section">
          <div class="action-buttons">
            <button id="create-character-btn" class="create-btn" disabled>
              <span class="btn-icon">🎭</span>
              <span class="btn-text">创建角色</span>
            </button>
            <button id="reset-form-btn" class="reset-btn">
              <span class="btn-icon">🔄</span>
              <span class="btn-text">重置表单</span>
            </button>
          </div>
          <div class="validation-message" id="validation-message">请选择阵营、职业和地点后才能创建角色</div>
        </div>
      </div>
    </div>
  </body>
</html>
