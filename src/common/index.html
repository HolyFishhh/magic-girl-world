<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>魔法少女世界状态栏</title>
  </head>
  <body>
    <main class="rpg-container mwg-statusbar" aria-label="魔法少女世界状态栏">
      <header class="statusbar-header">
        <div class="statusbar-title">
          <span class="statusbar-mark" aria-hidden="true">✦</span>
          <div>
            <strong>魔法少女世界</strong>
            <span>当前状态</span>
          </div>
        </div>
        <div class="statusbar-summary" aria-live="polite">
          <span class="summary-item"><small>时间</small><b id="status-time">未知</b></span>
          <span class="summary-item"><small>地点</small><b id="status-location">未知</b></span>
          <span class="summary-item"><small>职业</small><b id="status-job-name">未知</b></span>
          <span class="summary-item"><small>等级</small><b id="battle-level">LV 1</b></span>
          <span class="summary-item"><small>经验</small><b id="battle-exp">0/100</b></span>
        </div>
      </header>

      <section class="section run-section" id="run-section" style="display: none" aria-label="远征路线">
        <div class="run-heading">
          <div>
            <small>远征</small>
            <strong id="run-current">准备中</strong>
          </div>
          <div class="run-metrics" aria-live="polite">
            <span><small>Act</small><b id="run-act">1/3</b></span>
            <span><small>层数</small><b id="run-floor">0/10</b></span>
            <span><small>金币</small><b id="run-gold">99</b></span>
          </div>
        </div>
        <div class="run-actions" id="run-actions"></div>
        <div class="run-error" id="run-error" role="alert" style="display: none"></div>
      </section>

      <section class="section action-section" aria-label="本轮行动">

        <div id="choice-container" style="display: none">
          <div class="reward-card" id="choice-card">
            <div class="reward-header">
              <strong class="title" id="choice-title">奖励结算</strong>
            </div>
            <div class="reward-grid">
              <section class="pane pane-card" id="card-rewards-section" style="display: none">
                <div class="pane-head">
                  <div class="pane-title">卡牌 <span id="card-selection-count">3选1</span></div>
                  <div class="pane-sub">已选 <span id="card-selected">0</span>/<span id="card-max">1</span></div>
                </div>
                <div class="options" id="card-options"></div>
              </section>
              <section class="pane pane-artifact" id="artifact-rewards-section" style="display: none">
                <div class="pane-head">
                  <div class="pane-title">遗物 <span id="artifact-selection-count">3选1</span></div>
                  <div class="pane-sub">
                    已选 <span id="artifact-selected">0</span>/<span id="artifact-max">1</span>
                  </div>
                </div>
                <div class="options" id="artifact-options"></div>
              </section>
              <section class="pane pane-item" id="item-rewards-section" style="display: none">
                <div class="pane-head">
                  <div class="pane-title">道具 <span id="item-selection-count">3选1</span></div>
                  <div class="pane-sub">已选 <span id="item-selected">0</span>/<span id="item-max">1</span></div>
                </div>
                <div class="options" id="item-options"></div>
              </section>
            </div>
            <div class="reward-actions">
              <button class="btn btn-secondary" id="reroll-reward-btn" type="button" style="display: none">重投候选</button>
              <button class="btn btn-primary" id="confirm-btn" type="button" disabled>确认领取</button>
            </div>
          </div>
        </div>
      </section>

      <div class="statusbar-panels">
        <details class="status-panel">
          <summary><span aria-hidden="true">✨</span>角色状态</summary>
          <div class="panel-content">
            <section class="status-group">
              <h3>基本信息</h3>
              <div class="info-grid">
                <div class="info-item"><span class="label">职业能力</span><span class="value" id="status-job-ability">未知</span></div>
              </div>
            </section>
            <section class="status-group">
              <h3>服装</h3>
              <div class="info-grid clothing-grid">
                <div class="info-item"><span class="label">头部</span><span class="value" id="clothing-head">未知</span></div>
                <div class="info-item"><span class="label">颈部</span><span class="value" id="clothing-neck">未知</span></div>
                <div class="info-item"><span class="label">手部</span><span class="value" id="clothing-hands">未知</span></div>
                <div class="info-item"><span class="label">上衣</span><span class="value" id="clothing-top">未知</span></div>
                <div class="info-item"><span class="label">下装</span><span class="value" id="clothing-bottom">未知</span></div>
                <div class="info-item"><span class="label">内衣</span><span class="value" id="clothing-underwear">未知</span></div>
                <div class="info-item"><span class="label">腿部</span><span class="value" id="clothing-legs">未知</span></div>
                <div class="info-item"><span class="label">足部</span><span class="value" id="clothing-feet">未知</span></div>
              </div>
            </section>
            <section class="status-group">
              <h3>携带物品</h3>
              <div class="data-grid" id="carried-items"></div>
            </section>
            <section class="status-group">
              <h3>状态效果</h3>
              <div class="status-section">
                <div class="status-label">永久状态</div>
                <div class="status-tags" id="permanent-status"><span class="status-tag status-empty">无</span></div>
              </div>
              <div class="status-section">
                <div class="status-label">临时状态</div>
                <div class="status-tags" id="temporary-status"><span class="status-tag status-empty">无</span></div>
              </div>
            </section>
          </div>
        </details>

        <details class="status-panel">
          <summary><span aria-hidden="true">🃏</span>卡牌与资源</summary>
          <div class="panel-content">
            <section class="status-group run-opt-in" id="run-opt-in" style="display: none">
              <div class="group-heading">
                <h3>战斗准备</h3>
                <div class="run-opt-in-actions">
                  <button class="btn btn-plain" id="run-repair-btn" type="button" style="display: none">请求 MVU 修复</button>
                </div>
              </div>
              <div class="run-error" id="run-opt-in-error" role="alert" style="display: none"></div>
            </section>
            <section class="status-group compact-metrics">
              <div class="info-item"><span class="label">生命</span><span class="value" id="battle-hp">未知</span></div>
              <div class="info-item"><span class="label">欲望</span><span class="value" id="battle-desire">未知</span></div>
              <div class="info-item"><span class="label">删卡次数</span><span class="value" id="battle-card-remove">0</span></div>
            </section>
            <section class="status-group deck-archetype-profile" id="deck-archetype-profile" hidden>
              <div class="group-heading">
                <h3>构筑流派</h3>
                <span class="archetype-caption" id="deck-archetype-caption"></span>
              </div>
              <div class="archetype-share-bar" id="deck-archetype-share-bar" aria-label="当前卡组流派占比"></div>
              <div class="archetype-legend" id="deck-archetype-legend"></div>
              <div class="archetype-evolution" id="deck-archetype-evolution"></div>
            </section>
            <section class="status-group">
              <div class="group-heading">
                <h3>牌组</h3>
                <button id="delete-mode-toggle" class="icon-button delete-toggle-btn" type="button" title="切换删卡模式">
                  🗑️ <span id="delete-count">0</span>
                </button>
              </div>
              <div class="battle-deck" id="battle-deck"></div>
            </section>
            <section class="status-group split-resource">
              <div><h3>遗物</h3><div class="data-grid" id="battle-artifacts"></div></div>
              <div><h3>道具</h3><div class="data-grid" id="battle-items"></div></div>
            </section>
            <section class="status-group">
              <div class="battle-book-container">
                <button class="battle-book-btn" type="button">查看状态效果</button>
                <div class="battle-book-content" id="battle-book-content" style="display: none"></div>
              </div>
            </section>
          </div>
        </details>

        <details class="status-panel">
          <summary><span aria-hidden="true">👥</span>人物关系</summary>
          <div class="panel-content"><div class="data-grid" id="npc-relations"></div></div>
        </details>

        <details class="status-panel">
          <summary><span aria-hidden="true">🏰</span>势力关系</summary>
          <div class="panel-content">
            <div class="alignment-grid" id="alignment-grid"></div>
            <div class="info-item" id="invasion-intensity-row">
              <span class="label">入侵强度</span>
              <span class="value"><span id="invasion-intensity-badge" class="invasion-badge">未知</span></span>
            </div>
            <div class="data-grid" id="faction-relations"></div>
          </div>
        </details>
      </div>
    </main>
  </body>
</html>
