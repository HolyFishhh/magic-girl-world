<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>白木市魔法少女角色创建</title><style>:root{--primary-pink:#ff69b4;--primary-purple:#9370db;--primary-blue:#4682b4;--evil-red:#8b0000;--neutral-gray:#6c757d;--paper-bg:#fff8fb;--card-shadow:0 4px 18px rgba(129,73,103,0.12);--hover-shadow:0 8px 24px rgba(129,73,103,0.18);--text-primary:#2c3e50;--text-secondary:#6c757d;--border-color:#e9ecef;--border-radius:8px;--transition:all 0.3s cubic-bezier(0.4,0,0.2,1)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.6;color:var(--text-primary);background:var(--paper-bg);min-width:280px;overflow-x:hidden}.magical-girl-creator{position:relative;width:100%;max-width:1200px;margin:0 auto;padding:20px;min-height:100vh}.header-section{text-align:center;margin-bottom:40px;position:relative;z-index:2}.main-title{font-size:clamp(2rem,5vw,3rem);font-weight:700;color:#8b3f66;text-shadow:1px 1px 0 #fff;margin-bottom:10px}.main-title .sparkle{display:inline-block;animation:sparkle 2s ease-in-out infinite alternate}.subtitle{font-size:clamp(1rem,3vw,1.2rem);color:var(--text-secondary)}.creator-form{background:#fffefd;border-radius:var(--border-radius);padding:30px;box-shadow:var(--card-shadow);position:relative;z-index:2}.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.mode-card{display:grid;gap:5px;min-height:112px;padding:16px;border:2px solid var(--border-color);border-radius:var(--border-radius);background:#fff;color:var(--text-primary);text-align:left;cursor:pointer;transition:var(--transition)}.mode-card:hover,.mode-card.selected{border-color:var(--primary-pink);background:#fff0f6;box-shadow:var(--hover-shadow)}.mode-icon{font-size:1.5rem}.mode-name{font-size:1.1rem;font-weight:700}.mode-desc{color:var(--text-secondary);font-size:.9rem}.section{margin-bottom:40px}.section:last-child{margin-bottom:0}.section-title{font-size:1.5rem;font-weight:600;color:var(--text-primary);margin-bottom:20px;display:flex;align-items:center;gap:10px}.section-title .icon{font-size:1.2em}.faction-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}.faction-card{background:#fff;border:2px solid var(--border-color);border-radius:var(--border-radius);padding:25px;text-align:center;cursor:pointer;transition:var(--transition);position:relative;overflow:hidden}.faction-card::before{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent);transition:left .5s}.faction-card:hover{transform:translateY(-5px);box-shadow:var(--hover-shadow)}.faction-card:hover::before{left:100%}.faction-card.selected{border-width:3px;transform:scale(1.02)}.faction-card.selected[data-faction=magical_girl]{border-color:var(--primary-pink);background:linear-gradient(135deg,#fff,#fff0f5)}.faction-card.selected[data-faction=evil_forces]{border-color:var(--evil-red);background:linear-gradient(135deg,#fff,#fff5f5)}.faction-card.selected[data-faction=ordinary_people]{border-color:var(--primary-blue);background:linear-gradient(135deg,#fff,#f0f8ff)}.faction-icon{font-size:3rem;margin-bottom:15px;animation:float 3s ease-in-out infinite}.faction-name{font-size:1.2rem;font-weight:600;margin-bottom:10px;color:var(--text-primary)}.faction-desc{font-size:.9rem;color:var(--text-secondary);line-height:1.4}.job-grid{display:grid;gap:25px}.identity-section{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px}.identity-section h4{font-size:1.1rem;font-weight:600;color:var(--text-primary);margin-bottom:15px;padding:10px 15px;background:linear-gradient(135deg,#f8f9fa,#e9ecef);border-radius:8px;border-left:4px solid var(--primary-purple)}.identity-section:first-child h4{border-left-color:var(--primary-pink)}.job-card{background:#fff;border:2px solid var(--border-color);border-radius:var(--border-radius);padding:20px;text-align:center;cursor:pointer;transition:transform .3s ease,box-shadow .3s ease,height .4s ease;overflow:hidden}.job-card .job-desc{font-size:.85em;color:#888;margin-top:8px}.job-card .job-detailed-desc{font-size:.9em;color:#555;margin-top:12px;padding-top:12px;border-top:1px solid #eee;opacity:0;max-height:0;transition:opacity .4s ease,max-height .4s ease,margin-top .4s ease,padding-top .4s ease}.job-card:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 12px 24px rgba(0,0,0,.12)}.job-card:hover .job-detailed-desc{opacity:1;max-height:200px}.job-card.selected{border-color:var(--primary-purple);background:linear-gradient(135deg,#fff,#f8f4ff);transform:scale(1.02)}.job-card.supernatural-identity.selected{border-color:var(--primary-pink);background:linear-gradient(135deg,#fff,#fff8fb)}.job-card.ordinary-identity.selected{border-color:var(--primary-blue);background:linear-gradient(135deg,#fff,#f0f8ff)}.job-card.disabled{opacity:.5;cursor:not-allowed;pointer-events:none}.job-icon{font-size:2rem;margin-bottom:10px;display:block}.job-name{font-size:1rem;font-weight:600;margin-bottom:8px;color:var(--text-primary)}.location-category{display:inline-block;background:var(--primary-blue);color:#fff;padding:2px 8px;border-radius:12px;font-size:.7rem;font-weight:500;margin-top:8px}.description-container{position:relative}textarea{width:100%;padding:15px;border:2px solid var(--border-color);border-radius:var(--border-radius);font-size:1rem;font-family:inherit;line-height:1.6;resize:vertical;min-height:120px;transition:var(--transition)}textarea:focus{outline:none;border-color:var(--primary-purple)}.char-counter{position:absolute;bottom:10px;right:15px;font-size:.8rem;color:var(--text-secondary);background:hsla(0,0%,100%,.9);padding:2px 6px;border-radius:4px}.character-preview{background:linear-gradient(135deg,#f8f9fa,#e9ecef);border-radius:var(--border-radius);padding:25px}.preview-card{background:#fff;border-radius:var(--border-radius);padding:25px;box-shadow:0 4px 15px rgba(0,0,0,.1)}.preview-header{text-align:center;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid var(--border-color)}.preview-name{font-size:1.5rem;font-weight:700;color:var(--text-primary);margin-bottom:5px}.preview-faction{font-size:1rem;color:var(--text-secondary);font-weight:500}.preview-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:20px}.preview-item{display:flex;flex-direction:column;gap:5px}.preview-item .label{font-size:.9rem;color:var(--text-secondary);font-weight:500}.preview-item .value{font-size:1rem;color:var(--text-primary);font-weight:600}.preview-description .desc-label{font-size:.9rem;color:var(--text-secondary);font-weight:500;margin-bottom:8px}.preview-description .desc-content{font-size:1rem;color:var(--text-primary);line-height:1.6;padding:15px;background:#f8f9fa;border-radius:8px;border-left:4px solid var(--primary-purple)}.actions-section{text-align:center}.action-buttons{display:flex;justify-content:center;gap:20px;margin-bottom:15px;flex-wrap:wrap}.create-btn,.reset-btn{display:flex;align-items:center;gap:10px;padding:15px 30px;border:none;border-radius:25px;font-size:1.1rem;font-weight:600;cursor:pointer;transition:var(--transition);text-decoration:none}.create-btn .btn-icon,.reset-btn .btn-icon{font-size:1.2em}.create-btn{background:linear-gradient(135deg,var(--primary-pink),var(--primary-purple));color:#fff}.create-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 25px rgba(255,105,180,.4)}.create-btn:disabled{background:var(--neutral-gray);cursor:not-allowed;opacity:.6}.reset-btn{background:#fff;color:var(--text-primary);border:2px solid var(--border-color)}.reset-btn:hover{transform:translateY(-2px);border-color:var(--text-primary);box-shadow:0 8px 25px rgba(0,0,0,.1)}.validation-message{font-size:.9rem;color:var(--text-secondary);font-style:italic}.city-grid,.location-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;margin-top:15px}.city-card,.location-card{background-color:#fff;border-radius:var(--border-radius);padding:20px;text-align:center;border:2px solid rgba(0,0,0,0);cursor:pointer;box-shadow:0 4px 6px rgba(0,0,0,.05);transition:transform .3s ease,box-shadow .3s ease}.city-card .city-emoji,.location-card .city-emoji{font-size:2.5em;margin-bottom:10px}.city-card .city-name,.city-card .location-name,.location-card .city-name,.location-card .location-name{font-size:1.2em;font-weight:bold;color:#333}.city-card .location-name,.location-card .location-name{margin-bottom:8px}.city-card .city-status,.location-card .city-status{font-size:.8em;color:#fff;background-color:#ffc107;padding:2px 8px;border-radius:10px;display:inline-block;margin-top:8px}.city-card .city-desc,.city-card .location-desc,.location-card .city-desc,.location-card .location-desc{font-size:.9em;color:#777;margin-top:8px}.city-card .location-desc,.location-card .location-desc{line-height:1.3}.city-card:hover,.location-card:hover{transform:translateY(-5px);box-shadow:0 8px 16px rgba(0,0,0,.1)}.city-card.selected,.location-card.selected{border-color:var(--primary-blue);box-shadow:0 0 0 4px rgba(106,90,205,.2)}.city-card.disabled,.location-card.disabled{cursor:not-allowed;background-color:#f8f9fa;color:#adb5bd}.city-card.disabled .city-name,.city-card.disabled .location-name,.location-card.disabled .city-name,.location-card.disabled .location-name{color:#adb5bd}.city-card.disabled:hover,.location-card.disabled:hover{transform:none;box-shadow:0 4px 6px rgba(0,0,0,.05)}.location-card.selected{background:linear-gradient(135deg,#fff,#f0f8ff);transform:scale(1.02)}@keyframes sparkle{0%{transform:scale(1)}100%{transform:scale(1.1)}}@keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-20px)}}@media (max-width:768px){.mode-grid{grid-template-columns:1fr}.magical-girl-creator{padding:15px}.creator-form{padding:20px}.faction-grid{grid-template-columns:1fr}.job-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.location-grid{grid-template-columns:1fr}.action-buttons{flex-direction:column;align-items:center}.create-btn,.reset-btn{width:100%;max-width:300px}}@media (max-width:480px){.main-title{font-size:1.8rem}.subtitle{font-size:.9rem}.section-title{font-size:1.2rem}.job-grid{grid-template-columns:1fr}}
</style></head><body><div class="magical-girl-creator" id="character-creator-container"><div class="header-section"><h1 class="main-title"><span class="sparkle">✨</span> 白木市角色创建 <span class="sparkle">✨</span></h1><p class="subtitle">在怪人与怪谈的现代都市中创建你的角色</p></div><div class="creator-form"><div class="section mode-section"><h2 class="section-title"><span class="icon">✦</span>选择游戏模式</h2><div class="mode-grid" role="radiogroup" aria-label="选择游戏模式"><button class="mode-card selected" type="button" data-mode="story" role="radio" aria-checked="true"><span class="mode-icon">📖</span> <span class="mode-name">剧情模式</span> <span class="mode-desc">以角色扮演和城市故事为主，随时做出选择。</span></button> <button class="mode-card" type="button" data-mode="expedition" role="radio" aria-checked="false"><span class="mode-icon">🗺</span> <span class="mode-name">远征模式</span> <span class="mode-desc">在路线、战斗和营火之间推进一场完整远征。</span></button></div></div><div class="section faction-section"><h2 class="section-title"><span class="icon">⚔️</span> 选择阵营</h2><div class="faction-grid"><div class="faction-card" data-faction="magical_girl"><div class="faction-icon">🌟</div><div class="faction-name">魔法少女阵营</div><div class="faction-desc">守护正义与和平的魔法使用者</div></div><div class="faction-card" data-faction="evil_forces"><div class="faction-icon">👿</div><div class="faction-name">邪恶敌对势力</div><div class="faction-desc">企图破坏世界秩序的黑暗力量</div></div><div class="faction-card" data-faction="ordinary_people"><div class="faction-icon">👥</div><div class="faction-name">普通人</div><div class="faction-desc">生活在现代社会中的普通民众</div></div></div></div><div class="section job-section"><h2 class="section-title"><span class="icon">👔</span> 选择职业</h2><div class="job-grid"></div></div><div class="section location-section"><h2 class="section-title"><span class="icon">🏙️</span> 选择城市</h2><div class="city-grid"></div></div><div class="section location-section" id="location-section-container" style="display:none"><h2 class="section-title"><span class="icon">🏢</span> 选择所在地点</h2><div class="location-grid"></div></div><div class="section description-section"><h2 class="section-title"><span class="icon">💭</span> 额外描述（可选）</h2><div class="description-container"><textarea id="custom-description" placeholder="在这里添加角色的特殊设定、性格特点、背景故事等...&#10;例如：喜欢甜食的温柔女孩，有着不为人知的魔法天赋..." rows="4" maxlength="300">
